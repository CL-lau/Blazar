name: Verify Blazar

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify DeepSeek Harness, Pi, OpenCode, Qwen Code, and Gemini CLI with local model endpoints
        if: matrix.node == '24'
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          npm install --prefix "$tool_dir" --ignore-scripts --no-audit --no-fund \
            @deepseek-ai/dsh@0.2.2-rc.5 @earendil-works/pi-coding-agent@1.6.0 opencode-linux-x64@1.19.6 \
            @qwen-code/qwen-code@0.28.3 @google/gemini-cli@0.70.0
          BLAZAR_TEST_DEEPSEEK_EXECUTABLE="$tool_dir/node_modules/.bin/dsh" \
            BLAZAR_TEST_PI_EXECUTABLE="$tool_dir/node_modules/.bin/pi" \
            BLAZAR_TEST_OPENCODE_EXECUTABLE="$tool_dir/node_modules/opencode-linux-x64/bin/opencode" \
            BLAZAR_TEST_QWEN_EXECUTABLE="$tool_dir/node_modules/.bin/qwen" \
            BLAZAR_TEST_GEMINI_EXECUTABLE="$tool_dir/node_modules/.bin/gemini" \
            node --test services/router/{deepseek,pi,opencode,qwen,gemini}-runtime.test.ts
      - name: Verify Aider with a local model endpoint
        if: matrix.node == '24'
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          python3 -m venv "$tool_dir/venv"
          "$tool_dir/venv/bin/python" -m pip install --disable-pip-version-check aider-chat==0.86.2
          BLAZAR_TEST_AIDER_EXECUTABLE="$tool_dir/venv/bin/aider" node --test services/router/aider-runtime.test.ts
      - name: Verify Goose with a local model endpoint
        if: matrix.node == '24'
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --max-time 180 https://github.com/aaif-goose/goose/releases/download/v1.57.0/goose-x86_64-unknown-linux-gnu.tar.bz2 -o "$tool_dir/goose.tar.bz2"
          echo "e54036f3b7f95d3b0d7854c09465af5ef52a28c7fa03d2497d0ea68a6382282d  $tool_dir/goose.tar.bz2" | sha256sum -c
          tar -xf "$tool_dir/goose.tar.bz2" -C "$tool_dir"
          BLAZAR_TEST_GOOSE_EXECUTABLE="$tool_dir/goose" node --test services/router/goose-runtime.test.ts

  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: npm run desktop:bundle
      - name: Install verified XcodeGen release
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          cd "$tool_dir"
          curl --fail --silent --show-error --location \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip -o xcodegen.zip
          echo '620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892  xcodegen.zip' | shasum -a 256 -c
          ditto -x -k xcodegen.zip .
          echo "$tool_dir/xcodegen/bin" >> "$GITHUB_PATH"
      - run: npm run ios:build
      - run: npm run ios:test
